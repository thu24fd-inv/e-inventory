 if(t=='items'&&(!Number.isSafeInteger(r.total)||r.total<0))return alert('Total quantity must be a whole number of zero or more.');
 if(t=='items'&&!isNew&&r.total<(Number(row.out)||0))return alert('Total quantity cannot be lower than the number of items currently checked out.');
 if(t=='perfs'){const pin=(($('#m_pin')||{}).value||'').trim(),old=(($('#m_oldpin')||{}).value||'').trim();
  if((isNew||pin)&&!/^\d{4,8}$/.test(pin))return alert('The PIN must be 4 to 8 digits.');
  const res=await act({a:'save',t,row:r,pin},'Saved ✓');if(res.err)return;
  if(isNew&&res.id){U.perf=res.id;localStorage.perf=res.id}
  if(!isNew&&pin){const x=await act({a:'perf_pin',id:row.id,old,new:pin},'PIN changed ✓');if(x.err)return}
  render();closeM();if(again)openForm();return}
 if(t=='items'&&isNew){
  const rows=[...document.querySelectorAll('#szs .sz')].map(d=>{const i=d.querySelectorAll('input');return{size:i[0].value.trim(),color:i[1].value.trim(),qty:i[2].value}}).filter(x=>x.size||x.color||x.qty!=='');
  if(!rows.length)return alert('Enter at least one variation with a quantity (leave size blank for "One size").');
  for(const x of rows){const sz=x.size||'One size';if(S.items.some(i=>!i.archived&&i.kind==s&&i.name==r.name&&i.size==sz&&(i.color||'')==x.color))return alert(r.name+' · '+[x.color,sz].filter(Boolean).join(' · ')+' already exists. Close this and tap Edit on it instead.')}
  for(const x of rows)await api({a:'save',t:'items',row:{name:r.name,category:r.category||'',remarks:r.remarks||'',kind:s,size:x.size||'One size',color:x.color,total:+x.qty||0,archived:0}});
  await load();toast('Saved ✓');closeM();if(again)openForm();return}
 if(t=='members')r.active??=1;else if(t=='items'){r.archived??=0;r.kind=row.kind||s;r.size=r.size||'One size'}
 if(t=='items'&&!isNew&&(row.category||'')!==(r.category||'')){for(const x of S.items.filter(i=>i.kind==row.kind&&i.name==row.name&&i.id!=row.id))await api({a:'save',t:'items',row:{...x,category:r.category||''}})}
 await act({a:'save',t,row:r},'Saved ✓');
 closeM();if(again)openForm()}
async function flip(){const {t,row}=U.edit,r={...row};t=='members'?r.active=r.active?0:1:r.archived=r.archived?0:1;closeM();await act({a:'save',t,row:r},'Updated ✓')}
async function delRow(){const {t,row}=U.edit;if(!confirm('Delete “'+row.name+'”? If it has records, it will be archived instead.'))return;closeM();await act({a:'del',t,id:row.id})}
/* REPORTS */
const recList=()=>{const r=SL().filter(l=>(!U.rp||l.perf_id==U.rp)&&(!U.rm||l.member_id==U.rm)&&(!U.rs||(U.rs=='out')==!l.returned_at));
 return `<p class=mut>${r.length} record(s)</p>`+r.slice(0,100).map(l=>`<div class=li><div class=g><b>${esc(mb(l.member_id).name)}</b> · ${esc(lab(it(l.item_id)))} × ${l.qty}<div class=sub>${esc(pf(l.perf_id).name)} · out ${T(l.out_at)}${l.returned_at?' · back '+T(l.returned_at)+' · '+esc(l.cond||''):''}${l.out_note||l.ret_note?' · '+esc([l.out_note,l.ret_note].filter(Boolean).join(' / ')):''}</div></div><span class="pill ${l.returned_at?'ok':''}">${l.returned_at?'Returned':'Out'}</span></div>`).join('')+(r.length>100?'<p class=mut>Showing the newest 100. Narrow the filters, or download Excel for everything.</p>':'')};
const loadX=()=>new Promise(r=>{const e=document.createElement('script');e.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';e.onload=()=>r(1);e.onerror=()=>r(0);document.head.appendChild(e)});
v.rep=()=>`<div class=card><h3>Records</h3><div class=grid>
<div><label class=f>Performance</label><select onchange="U.rp=this.value;$('#rec').innerHTML=recList()"><option value="">All</option>${perfOpts(U.rp)}</select></div>
<div><label class=f>Member</label><select onchange="U.rm=this.value;$('#rec').innerHTML=recList()"><option value="">All</option>${S.members.map(m=>`<option value=${m.id} ${U.rm==m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div>
<div><label class=f>Status</label><select onchange="U.rs=this.value;$('#rec').innerHTML=recList()"><option value="">All</option><option value=out ${U.rs=='out'?'selected':''}>Still out</option><option value=back ${U.rs=='back'?'selected':''}>Returned</option></select></div></div><div id=rec style="margin-top:12px">${recList()}</div></div>
`+`<div class=card><h3>Excel report — ${U.sec=='other'?'instruments &amp; others':'clothes'}</h3><p class=mut>Stock, items currently out, performance records and members for this section.</p><button class=btn onclick=xl()>Download Excel report</button></div>
<div class=card><h3>Backup</h3><p class=mut>Download a backup regularly and keep it somewhere safe.</p><button class=btn onclick=bk()>Download full backup</button>
<h3 style="margin-top:24px">Restore</h3><p class=mut>Replaces ALL current data with the backup file.</p><input type=file accept=.json onchange=rs(this)></div>`;
async function xl(){if(!window.XLSX&&!await loadX())return alert('Could not load the Excel library. Check your connection.');const w=XLSX.utils.book_new(),add=(n,a)=>XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(a),n),kn=i=>({Type:i.kind,Category:i.category||'',Name:i.name,Colour:i.color||'',Size:i.size});
 add('In store now',S.items.filter(i=>!i.archived&&inSec(i)).map(i=>({...kn(i),Total:i.total,Out:i.out,'In store':i.total-i.out})));
 const L=l=>({Performance:pf(l.perf_id).name,Member:mb(l.member_id).name,...kn(it(l.item_id)),Quantity:l.qty,'Check-out time':T(l.out_at),'Check-out remarks':l.out_note});
 add('Currently out',SL().filter(l=>!l.returned_at).map(L));
 add('Performance records',SL().map(l=>({...L(l),'Return time':l.returned_at?T(l.returned_at):'','Return condition':l.cond||'','Return remarks':l.ret_note||'',Status:l.returned_at?'Returned':'Out'})));
 add('Members',S.members.map(m=>({Name:m.name,Role:m.role,Status:m.active?'Active':'Inactive'})));
 XLSX.writeFile(w,`${U.sec=='other'?'others':'clothes'}-inventory-${today()}.xlsx`)}
async function bk(){const r=await fetch('/api?backup=1',{cache:'no-store',headers:{'x-pass':P}});if(!r.ok)return alert('Could not make the backup. Try again.');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([await r.text()],{type:'application/json'}));a.download=`backup-${today()}.json`;a.click()}
async function rs(el){const f=el.files[0];if(f&&confirm('This REPLACES all current data with the backup. Continue?'))await act({a:'restore',data:JSON.parse(await f.text())},'Restored ✓')}
if(L=='zh'){document.documentElement.lang='zh-CN';document.title='THU24FD 电子库存';tx(document.body)}
load();
